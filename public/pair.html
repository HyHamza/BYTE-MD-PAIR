<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pair Code</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 450px;
            background: rgba(20, 20, 30, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 2rem;
            border: 1px solid rgba(79, 70, 229, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: #818cf8;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #f1f5f9;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid rgba(79, 70, 229, 0.3);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            color: #f1f5f9;
            font-size: 1rem;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #818cf8;
            background: rgba(79, 70, 229, 0.1);
        }

        select {
            cursor: pointer;
        }

        select option {
            background: #1a1a2e;
            color: #f1f5f9;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(79, 70, 229, 0.4);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 0.3rem;
            display: none;
        }

        .code-section {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(79, 70, 229, 0.1);
            display: none;
        }

        .code-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #818cf8;
            letter-spacing: 1px;
            margin: 1rem 0;
            font-family: 'Courier New', monospace;
        }

        .status {
            font-size: 0.9rem;
            color: #94a3b8;
            margin: 1rem 0;
            display: none;
        }

        .status.active {
            display: block;
        }

        .status-indicator {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #818cf8;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .copy-btn {
            width: 100%;
            padding: 8px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: #7c3aed;
        }

        .home-link {
            display: block;
            text-align: center;
            color: #818cf8;
            text-decoration: none;
            margin-top: 1rem;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .home-link:hover {
            color: #7c3aed;
        }

        @media (max-width: 480px) {
            .card {
                padding: 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .code-value {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>Pair Code</h1>
            <p class="subtitle">Enter your WhatsApp number to get pairing code</p>
        </div>

        <div id="input-section">
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input 
                    type="text" 
                    id="phone" 
                    placeholder="e.g., 92307xxxxxxxx"
                    inputmode="numeric"
                >
                <div class="error" id="error"></div>
            </div>

            <div class="form-group">
                <label for="format">Format</label>
                <select id="format">
                    <option value="creds">creds.json File</option>
                    <option value="base64">Session ID (Base64)</option>
                </select>
            </div>

            <button id="submit" class="btn">
                <i class="fas fa-send"></i>
                <span id="btn-text">Get Code</span>
                <i class="fas fa-spinner fa-spin" id="spinner" style="display: none;"></i>
            </button>
        </div>

        <div class="status" id="status">
            <span class="status-indicator"></span>
            <span id="status-text">Processing...</span>
        </div>

        <div class="code-section" id="code-section">
            <p style="color: #94a3b8; font-size: 0.9rem;">Your pairing code:</p>
            <div class="code-value" id="code"></div>
            <button class="copy-btn" id="copy">
                <i class="fas fa-copy"></i> Copy Code
            </button>
        </div>

        <a href="./" class="home-link">← Back to Home</a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
    <script>
        const phone = document.getElementById('phone');
        const submit = document.getElementById('submit');
        const error = document.getElementById('error');
        const status = document.getElementById('status');
        const statusText = document.getElementById('status-text');
        const codeSection = document.getElementById('code-section');
        const codeValue = document.getElementById('code');
        const copy = document.getElementById('copy');
        const spinner = document.getElementById('spinner');
        const btnText = document.getElementById('btn-text');

        function validate(num) {
            return /^\d{10,15}$/.test(num.replace(/\D/g, ''));
        }

        submit.addEventListener('click', async () => {
            const num = phone.value.trim();
            const format = document.getElementById('format').value;
            error.style.display = 'none';

            if (!validate(num)) {
                error.textContent = 'Enter valid number (10-15 digits)';
                error.style.display = 'block';
                return;
            }

            submit.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'inline-block';
            status.classList.add('active');

            try {
                const { data } = await axios.get(`/code?number=${num}&format=${format}`);
                codeValue.textContent = data.code;
                codeSection.style.display = 'block';
                statusText.textContent = data.sessionId ? 'Connected' : 'Code received';
                document.getElementById('input-section').style.display = 'none';
            } catch (err) {
                error.textContent = 'Error: ' + (err.response?.data?.code || 'Try again');
                error.style.display = 'block';
                status.classList.remove('active');
            } finally {
                submit.disabled = false;
                btnText.style.display = 'inline-block';
                spinner.style.display = 'none';
            }
        });

        copy.addEventListener('click', () => {
            navigator.clipboard.writeText(codeValue.textContent);
            copy.textContent = '✓ Copied!';
            setTimeout(() => {
                copy.innerHTML = '<i class="fas fa-copy"></i> Copy Code';
            }, 2000);
        });

        phone.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '');
            if (error.style.display === 'block') error.style.display = 'none';
        });
    </script>
</body>
</html>
