<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #818cf8;
        }

        p {
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 3rem;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: rgba(99, 102, 241, 0.05);
            color: #818cf8;
            border: 1px solid #4f46e5;
        }

        .btn-secondary:hover {
            background: rgba(99, 102, 241, 0.2);
            transform: translateY(-2px);
        }

        .links {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-top: 2rem;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            background: rgba(99, 102, 241, 0.05);
            border-radius: 10px;
            color: #818cf8;
            text-decoration: none;
            font-size: 1.5rem;
            transition: all 0.2s;
            border: 1px solid rgba(79, 70, 229, 0.2);
        }

        .link-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Session Generator</h1>
        <p>Generate WhatsApp session using Pair Code or QR Code</p>

        <div class="buttons">
            <a href="./pair" class="btn btn-primary">
                <i class="fas fa-link"></i> Pair Code
            </a>
            <a href="./qr" class="btn btn-primary">
                <i class="fas fa-qrcode"></i> QR Code
            </a>
        </div>

        <p style="font-size: 0.95rem; margin: 3rem 0 2rem;">Generate WhatsApp sessions</p>

        <div class="buttons">
            <a href="./validate" class="btn btn-secondary">
                <i class="fas fa-check-circle"></i> Validate Session
            </a>
            <a href="./decrypt" class="btn btn-secondary">
                <i class="fas fa-key"></i> Decrypt ID
            </a>
        </div>

        <p style="font-size: 0.9rem; color: #64748b;">Test or manage existing sessions</p>

        <div class="links">
            <a href="https://github.com/HyHamza/Session-Generator" target="_blank" class="link-btn" title="GitHub">
                <i class="fab fa-github"></i>
            </a>
            <a href="https://youtube.com/@talkdrove" target="_blank" class="link-btn" title="YouTube">
                <i class="fab fa-youtube"></i>
            </a>
            <a href="https://whatsapp.com/channel/0029VaNRcHSJP2199iMQ4W0l" target="_blank" class="link-btn" title="WhatsApp">
                <i class="fab fa-whatsapp"></i>
            </a>
        </div>
    </div>
</body>
</html>
